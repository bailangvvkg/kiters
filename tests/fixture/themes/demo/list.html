<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>{{ title }} · {{ site.title }}</title></head>
<body class="demo-theme demo-list">
<h1>{{ title }}</h1>
<ul>
{% for item in items %}
<li><a href="{{ item.url }}">{{ item.title }}</a>{% if item.date %} — {{ item.date }}{% endif %}</li>
{% endfor %}
</ul>
</body>
</html>
