[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "plugins/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2"
comrak = { version = "0.24", default-features = false }
minijinja = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
kiters-core = { path = "crates/kiters-core" }
kiters-parse = { path = "crates/kiters-parse" }
kiters-render = { path = "crates/kiters-render" }
kiters-build = { path = "crates/kiters-build" }
kiters-serve = { path = "crates/kiters-serve" }
kiters-wasm = { path = "crates/kiters-wasm" }
tempfile = "3"
pprof = { version = "0.13", default-features = false, features = ["prost-codec", "flamegraph", "cpp"] }
