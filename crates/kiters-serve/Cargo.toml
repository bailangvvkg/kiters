[package]
name = "kiters-serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kiters-core.workspace = true
kiters-build.workspace = true
kiters-parse.workspace = true
kiters-wasm.workspace = true
kiters-admin.workspace = true
anyhow.workspace = true
chrono.workspace = true
arc-swap = "1"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "compression-zstd", "set-header"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
