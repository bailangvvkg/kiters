<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studio · kiters</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f5; --paper: #ffffff; --ink: #222220; --muted: #71706b;
    --faint: #a5a29a; --border: #e7e4dc; --border-2: #d9d5cb;
    --brand: #c0764e; --brand-ink: #a8603c; --brand-wash: #f7ece5;
    --ok: #3e7d5a; --ok-wash: #eaf3ee; --warn: #9a7b1e; --warn-wash: #f7f1dd;
    --hold: #4a6f9e; --hold-wash: #eaf0f8; --bad: #b0483f; --bad-wash: #f8ecea;
    --shadow: 0 1px 2px rgb(34 34 32 / .05), 0 8px 28px -18px rgb(34 34 32 / .25);
  }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme="light"]) { color-scheme: dark;
      --bg: #1c1c1a; --paper: #262624; --ink: #ecebe5; --muted: #a3a199;
      --faint: #6d6c66; --border: #333330; --border-2: #3f3f3b;
      --brand: #d18a60; --brand-ink: #dfa27e; --brand-wash: #33272080;
      --ok: #7db897; --ok-wash: #1f2a24; --warn: #d3b45e; --warn-wash: #2b2618;
      --hold: #8aa9d3; --hold-wash: #1e242e; --bad: #d98a83; --bad-wash: #2e1f1e;
      --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -18px rgb(0 0 0 / .6);
    }
  }
  html[data-theme="dark"] { color-scheme: dark;
    --bg: #1c1c1a; --paper: #262624; --ink: #ecebe5; --muted: #a3a199;
    --faint: #6d6c66; --border: #333330; --border-2: #3f3f3b;
    --brand: #d18a60; --brand-ink: #dfa27e; --brand-wash: #33272080;
    --ok: #7db897; --ok-wash: #1f2a24; --warn: #d3b45e; --warn-wash: #2b2618;
    --hold: #8aa9d3; --hold-wash: #1e242e; --bad: #d98a83; --bad-wash: #2e1f1e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -18px rgb(0 0 0 / .6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.6 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg);
         border: 1px solid var(--border-2); border-radius: 8px; padding: 7px 10px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-wash); border-color: var(--brand); }
  a { color: var(--brand-ink); }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

  /* ---- top bar ---- */
  .top { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 18px;
         background: var(--paper); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
  .top .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--brand);
               color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .top h1 { font-size: 14.5px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  .top h1 small { color: var(--faint); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .top .spacer { flex: 1; }
  .btn { border: 1px solid var(--border-2); background: var(--paper); color: var(--ink);
         border-radius: 8px; padding: 6px 13px; font-size: 13px; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--brand); }
  .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  .btn.brand:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--border-2); }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* ---- login ---- */
  .login-wrap { min-height: 100dvh; display: grid; place-items: center; }
  .login-card { width: min(380px, 92vw); background: var(--paper); border: 1px solid var(--border);
                border-radius: 16px; padding: 34px 32px; box-shadow: var(--shadow); text-align: center; }
  .login-card .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #fff;
                      display: grid; place-items: center; font-weight: 700; font-size: 20px; margin: 0 auto 14px; }
  .login-card h1 { font-size: 19px; margin: 0 0 4px; }
  .login-card p { color: var(--muted); font-size: 12.5px; margin: 0 0 20px; }
  .login-card input { width: 100%; text-align: center; margin-bottom: 10px; }
  .login-card .btn { width: 100%; padding: 9px; }

  /* ---- shell ---- */
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100dvh - 52px); }
  @media (max-width: 860px) { .shell { grid-template-columns: 1fr; height: auto; } }

  /* ---- list (left) ---- */
  .list-pane { border-right: 1px solid var(--border); background: var(--paper); display: flex; flex-direction: column; min-height: 0; }
  .list-pane .head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .list-pane .head h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
                        color: var(--faint); font-weight: 650; margin: 0; flex: 1; }
  .items { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  .items li { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px;
              cursor: pointer; border: 1px solid transparent; }
  .items li:hover { background: color-mix(in srgb, var(--brand-wash) 55%, transparent); }
  .items li.active { background: var(--brand-wash); border-color: color-mix(in srgb, var(--brand) 28%, transparent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.published { background: var(--ok); }
  .dot.draft { background: var(--warn); }
  .dot.scheduled { background: var(--hold); }
  .items .t { min-width: 0; flex: 1; }
  .items .t .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; font-weight: 550; }
  .items .t .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faint); font-size: 11px; }
  .items .when { color: var(--faint); font-size: 10.5px; flex: none; }
  .items li.empty { color: var(--faint); cursor: default; font-size: 13px; justify-content: center; padding: 26px 0; }

  /* ---- editor (right) ---- */
  .edit-pane { overflow-y: auto; padding: 22px clamp(16px, 4vw, 44px) 60px; }
  .edit-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .edit-head .rev { color: var(--faint); font-size: 11px; }
  .edit-head .id { color: var(--faint); font-size: 11.5px; }
  #f-title { width: 100%; font-size: 20px; font-weight: 650; border: none; background: transparent;
             padding: 6px 2px; border-bottom: 1px solid var(--border); border-radius: 0; }
  #f-title:focus { outline: none; border-bottom-color: var(--brand); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 16px 0; }
  .field label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
                 color: var(--faint); font-weight: 650; margin-bottom: 5px; }
  .field input, .field select { width: 100%; }
  .field .hint { color: var(--warn); font-size: 10.5px; margin-top: 3px; }
  #f-body { width: 100%; min-height: 46vh; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 13px; line-height: 1.75; resize: vertical; background: var(--paper); }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions .note { color: var(--faint); font-size: 11.5px; flex: 1; min-width: 180px; }
  .dirty { color: var(--brand-ink); font-weight: 600; }

  /* ---- preview ---- */
  .preview-pane { display: none; }
  .shell.previewing { grid-template-columns: 300px minmax(0, 1fr) minmax(0, 46%); }
  .shell.previewing .preview-pane { display: block; border-left: 1px solid var(--border); background: var(--bg); }
  @media (max-width: 1180px) { .shell.previewing { grid-template-columns: 300px minmax(0, 1fr); }
    .shell.previewing .preview-pane { position: fixed; inset: 52px 0 0 0; z-index: 25; } }
  #preview { width: 100%; height: 100%; border: 0; background: #fff; }

  /* ---- modal ---- */
  .veil { position: fixed; inset: 0; background: rgb(20 20 18 / .4); display: grid; place-items: center; z-index: 50; }
  .modal { width: min(400px, 92vw); background: var(--paper); border: 1px solid var(--border);
           border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 14px; font-size: 15.5px; }
  .modal .field { margin-bottom: 12px; }

  /* ---- toast ---- */
  .toast { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast div { background: var(--paper); border: 1px solid var(--border); border-left: 3px solid var(--brand);
               border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow);
               animation: rise .18s ease-out; max-width: 320px; }
  .toast div.ok { border-left-color: var(--ok); }
  .toast div.err { border-left-color: var(--bad); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hide { display: none !important; }
</style>
</head>
<body>

<!-- login -->
<div class="login-wrap hide" id="login-view">
  <form class="login-card" id="login-form">
    <div class="mark">K</div>
    <h1>studio</h1>
    <p>一个密码,进后台。文件树即真相。</p>
    <input type="password" id="password" placeholder="密码" autofocus autocomplete="current-password">
    <button class="btn brand" type="submit">进入</button>
  </form>
</div>

<!-- app -->
<div class="hide" id="app-view">
  <div class="top">
    <div class="mark">K</div>
    <h1>studio<small id="site-name"></small></h1>
    <span class="spacer"></span>
    <span id="save-state" class="mono" style="color:var(--faint);font-size:11px"></span>
    <button class="btn ghost" id="logout">登出</button>
  </div>

  <div class="shell" id="shell">
    <aside class="list-pane">
      <div class="head">
        <h2>内容</h2>
        <button class="btn" id="new-btn" style="padding:4px 10px;font-size:12px">+ 新建</button>
        <button class="btn ghost" id="refresh-btn" style="padding:4px 8px;font-size:12px">⟳</button>
      </div>
      <ul class="items" id="items"></ul>
    </aside>

    <main class="edit-pane" id="edit-pane">
      <div class="hide" id="editor">
        <div class="edit-head">
          <span class="id mono" id="editor-id"></span>
          <span class="spacer" style="flex:1"></span>
          <span class="rev mono" id="rev"></span>
        </div>
        <input id="f-title" placeholder="标题" autocomplete="off">
        <div class="grid">
          <div class="field">
            <label>状态</label>
            <select id="f-status">
              <option value="draft">草稿</option>
              <option value="published">已发布</option>
              <option value="scheduled">定时</option>
            </select>
          </div>
          <div class="field">
            <label>日期</label>
            <input id="f-date" placeholder="2026-01-01">
          </div>
          <div class="field" style="grid-column: 1 / -1">
            <label>封面</label>
            <input id="f-cover" placeholder="封面图地址(可空)">
          </div>
          <div class="field">
            <label>分类 / 标签</label>
            <input id="f-tags" placeholder="逗号隔开:随笔, 运维">
          </div>
          <div class="field" style="grid-column: 1 / -1">
            <label>别名(旧地址)</label>
            <input id="f-aliases" placeholder="/archives/123, 逗号隔开">
            <div class="hint">留空保存会丢掉旧地址跳转——编辑时先确认这里</div>
          </div>
        </div>
        <textarea id="f-body" placeholder="正文,markdown" spellcheck="false"></textarea>
        <div class="actions">
          <span class="note">保存即写盘,watch 立刻重建,前台刷新可见。<b>Ctrl+S</b></span>
          <button class="btn danger-ghost" id="delete-btn" style="color:var(--bad)">删除</button>
          <button class="btn" id="preview-btn">预览</button>
          <button class="btn brand" id="save-btn">保存</button>
        </div>
      </div>
    </main>

    <aside class="preview-pane" id="preview-pane">
      <iframe id="preview"></iframe>
    </aside>
  </div>
</div>

<!-- new modal -->
<div class="veil hide" id="new-modal">
  <form class="modal" id="new-form">
    <h3>新建一篇</h3>
    <div class="field">
      <label>类型(kind,目录名)</label>
      <input id="n-kind" value="posts" placeholder="posts">
    </div>
    <div class="field">
      <label>slug(目录名,小写字母、数字和 -)</label>
      <input id="n-slug" placeholder="my-first-post" autofocus>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button type="button" class="btn" id="new-cancel">取消</button>
      <button type="submit" class="btn brand">创建</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let currentId = null, currentRev = null, dirty = false;

function setDirty(on) {
  dirty = on;
  const s = $("save-state");
  s.textContent = on ? "未保存 ●" : "";
  s.className = "mono" + (on ? " dirty" : "");
  $("save-btn").classList.toggle("brand", on);
}

function say(ok, text) {
  const box = $("toast");
  const el = document.createElement("div");
  el.className = ok ? "ok" : "err";
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({ "content-type": "application/json" }, opts.headers);
  const resp = await fetch(path, opts);
  if (resp.status === 401) { showLogin(); throw new Error("登录过期"); }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) {
    const err = new Error(data.error || resp.status);
    err.status = resp.status;
    err.data = data;
    throw err;
  }
  return data;
}

function showLogin() {
  $("login-view").classList.remove("hide");
  $("app-view").classList.add("hide");
}
async function enter() {
  $("login-view").classList.add("hide");
  $("app-view").classList.remove("hide");
  await refresh();
}

$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("password").value }) });
    $("password").value = "";
    await enter();
  } catch { say(false, "密码不对"); }
});

$("logout").addEventListener("click", async () => {
  await api("/api/logout", { method: "POST" }).catch(() => {});
  showLogin();
});

const STATUS_LABEL = { draft: "草稿", published: "已发", scheduled: "定时" };

async function refresh(keepId) {
  try {
    const data = await api("/api/contents?limit=100");
    const ul = $("items");
    ul.innerHTML = "";
    data.items.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
    for (const it of data.items) {
      const st = it.status || "draft";
      const li = document.createElement("li");
      if (it.id === (keepId || currentId)) li.classList.add("active");
      const title = it.title || it.slug;
      li.innerHTML =
        `<span class="dot ${st}" title="${STATUS_LABEL[st] || st}"></span>` +
        `<span class="t"><span class="title"></span><span class="meta mono"></span></span>` +
        (it.date ? `<span class="when mono">${String(it.date).slice(0, 10)}</span>` : "");
      li.querySelector(".title").textContent = title;
      li.querySelector(".meta").textContent = it.id;
      li.addEventListener("click", () => openItem(it.id));
      ul.appendChild(li);
    }
    if (!data.items.length) ul.innerHTML = `<li class="empty">还没有内容,新建一篇。</li>`;
    $("site-name").textContent = `${data.items.length} 项 · 文件树即真相`;
  } catch (err) { say(false, err.message); }
}
$("refresh-btn").addEventListener("click", () => refresh());

async function openItem(id) {
  if (dirty && !confirm("有未保存的改动,丢弃?")) return;
  try {
    const item = await api("/api/contents/" + encodeURIComponent(id));
    currentId = id;
    currentRev = item.revision;
    $("editor-id").textContent = id;
    $("f-title").value = item.front.title || "";
    $("f-status").value = item.front.status || "draft";
    $("f-date").value = item.front.date ? String(item.front.date).slice(0, 10) : "";
    $("f-tags").value = (item.front.tags || []).join(", ");
    $("f-aliases").value = (item.front.aliases || []).join(", ");
    $("f-cover").value = item.front.cover || "";
    $("f-body").value = item.body || "";
    $("rev").textContent = "rev " + String(item.revision).slice(0, 10);
    $("editor").classList.remove("hide");
    setDirty(false);
    document.querySelectorAll(".items li").forEach(li => li.classList.remove("active"));
    refresh(id).then(() => {});
    $("f-title").focus();
  } catch (err) { say(false, err.message); }
}

for (const id of ["f-title", "f-date", "f-tags", "f-aliases", "f-cover", "f-body"]) {
  $(id).addEventListener("input", () => setDirty(true));
}
$("f-status").addEventListener("change", () => setDirty(true));

function collect() {
  return {
    kind: currentId ? currentId.split(":")[0] : "posts",
    title: $("f-title").value.trim(),
    status: $("f-status").value,
    date: $("f-date").value.trim() || null,
    cover: $("f-cover").value.trim() || null,
    tags: $("f-tags").value.split(/[,，]/).map(t => t.trim()).filter(Boolean),
    aliases: $("f-aliases").value.split(/[,，]/).map(t => t.trim()).filter(Boolean),
    body: $("f-body").value,
  };
}

async function save() {
  if (!currentId) return;
  try {
    const data = await api("/api/contents/" + encodeURIComponent(currentId), {
      method: "PUT",
      headers: { "if-match": currentRev },
      body: JSON.stringify(collect()),
    });
    currentRev = data.revision;
    $("rev").textContent = "rev " + String(data.revision).slice(0, 10);
    setDirty(false);
    say(true, "保存了,前台已重建");
    refresh(currentId);
  } catch (err) {
    if (err.status === 409) {
      say(false, "被别人改过了——关掉重开,拿新的再改");
    } else {
      say(false, err.message);
    }
  }
}
$("save-btn").addEventListener("click", save);
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); if (currentId) save(); }
});

$("delete-btn").addEventListener("click", async () => {
  if (!currentId) return;
  if (!confirm("删掉 " + currentId + "?文件从树上拿走,不可撤销。")) return;
  try {
    await api("/api/contents/" + encodeURIComponent(currentId), {
      method: "DELETE",
      headers: { "if-match": currentRev },
    });
    currentId = null;
    $("editor").classList.add("hide");
    say(true, "删掉了");
    refresh();
  } catch (err) { say(false, err.status === 409 ? "又被改了,重开再删" : err.message); }
});

$("new-btn").addEventListener("click", () => {
  $("n-slug").value = "";
  $("new-modal").classList.remove("hide");
  $("n-slug").focus();
});
$("new-cancel").addEventListener("click", () => $("new-modal").classList.add("hide"));
$("new-modal").addEventListener("click", (e) => { if (e.target === $("new-modal")) $("new-modal").classList.add("hide"); });
$("new-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const kind = $("n-kind").value.trim() || "posts";
  const slug = $("n-slug").value.trim();
  if (!slug) return;
  try {
    const data = await api("/api/contents", {
      method: "POST",
      body: JSON.stringify({ kind, slug, title: "未命名", status: "draft", tags: [], body: "新的一篇。\n" }),
    });
    $("new-modal").classList.add("hide");
    say(true, "建好了:" + data.id);
    await refresh();
    openItem(data.id);
  } catch (err) { say(false, err.message); }
});

const PREVIEW_CSS = `<style>
  :root { color-scheme: light; }
  body { font: 15px/1.75 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222220;
         background: #faf9f5; margin: 0; padding: 26px clamp(16px, 5vw, 48px); }
  pre { background: #f1efe8; padding: 12px 14px; border-radius: 8px; overflow: auto; font-size: 13px; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  img { max-width: 100%; border-radius: 8px; }
  blockquote { border-left: 3px solid #d9d5cb; margin: 0; padding: 2px 16px; color: #71706b; }
  h1,h2,h3 { line-height: 1.3; }
  a { color: #a8603c; }
  table { border-collapse: collapse; } td, th { border: 1px solid #d9d5cb; padding: 6px 10px; }
</style>`;
$("preview-btn").addEventListener("click", async () => {
  try {
    const data = await api("/api/preview", { method: "POST", body: JSON.stringify({ body: $("f-body").value }) });
    $("preview").srcdoc = `<!doctype html><meta charset="utf-8">${PREVIEW_CSS}${data.html}`;
    $("shell").classList.add("previewing");
  } catch (err) { say(false, err.message); }
});
$("preview-btn").addEventListener("dblclick", () => $("shell").classList.remove("previewing"));

api("/api/session").then(enter).catch(() => {});
</script>
</body>
</html>
